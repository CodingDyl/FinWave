# backend/alembic.ini
[alembic]
script_location = app/db/migrations
# URL is read from settings in env.py, but keep a placeholder:
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@db:5432/fintech

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
