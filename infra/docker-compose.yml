version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: fintech
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile   # <— under build
    env_file:
      - ../backend/.env
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app/backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    env_file:
      - ../frontend/.env
    working_dir: /app/frontend
    command: npm run dev -- --host
    volumes:
      - ../frontend:/app/frontend
      - web_node_modules:/app/frontend/node_modules   # keep deps in container
    ports:
      - "5173:5173"
    depends_on: [api]

volumes:
  dbdata:
  web_node_modules: {}
