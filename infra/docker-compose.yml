version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: fintech
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fintech"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Migration service - runs once before API starts
  migrate:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file:
      - ../backend/.env
    environment:
      - FRONTEND_URL=http://localhost:5173
      - OAUTH_REDIRECT_URI=http://localhost:5173/api/v1/auth/callback
      - PYTHONPATH=/app/backend
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=fintech
    working_dir: /app/backend
    command: python /app/backend/migrate.py
    volumes:
      - ../backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file:
      - ../backend/.env
    environment:
      - FRONTEND_URL=http://localhost:5173
      - OAUTH_REDIRECT_URI=http://localhost:5173/api/v1/auth/callback
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - ENV_NAME=dev
      - STRIPE_CONNECTED_ACCOUNT_ID=acct_1S6GC5K3YPv8GzMh
      - PYTHONPATH=/app/backend
    working_dir: /app/backend
    command: bash /app/backend/start.sh
    volumes:
      - ../backend:/app/backend
    ports:
      - "8000:8000"
    depends_on:
      - migrate
      - redis
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    env_file:
      - ../frontend/.env
    working_dir: /app/frontend
    command: npm run dev -- --host
    volumes:
      - ../frontend:/app/frontend
      - web_node_modules:/app/frontend/node_modules   # keep deps in container
    ports:
      - "5173:5173"
    depends_on: [api]

  # Stripe CLI authentication (run once to login)
  stripe-auth:
    image: stripe/stripe-cli:latest
    entrypoint: ["stripe"]
    command: ["login"]
    volumes:
      - stripe_config:/root/.config/stripe
    profiles: ["dev"]
    stdin_open: true
    tty: true

  # Stripe CLI for webhook forwarding (development only)
  stripe-cli:
    image: stripe/stripe-cli:latest
    entrypoint: ["stripe"]
    command: ["listen", "--forward-to", "http://api:8000/api/v1/webhooks/stripe"]
    ports:
      - "12111:12111"
    volumes:
      - stripe_config:/root/.config/stripe
    depends_on: [api]
    profiles: ["dev"]  # Only run in development
    restart: unless-stopped

volumes:
  dbdata:
  web_node_modules: {}
  stripe_config: {}
